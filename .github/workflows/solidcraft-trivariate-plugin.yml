name: SolidCraft Trivariate plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/solidcraft-trivariate/**"
      - "scripts/*compact*.py"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/solidcraft-trivariate-plugin.yml"
  pull_request:
    paths:
      - "plugins/solidcraft-trivariate/**"
      - "scripts/*compact*.py"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/solidcraft-trivariate-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the guest module
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/solidcraft-target
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path plugins/solidcraft-trivariate/Cargo.toml

      - name: Install wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          version=1.262.0
          archive="wasm-tools-${version}-x86_64-linux.tar.gz"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/${archive}"
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/wasm-tools"
          echo "$RUNNER_TEMP/wasm-tools/wasm-tools-${version}-x86_64-linux" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasm-tools/wasm-tools-${version}-x86_64-linux/wasm-tools" --version

      - name: Wrap and inspect the component
        run: |
          wasm-tools component new "$RUNNER_TEMP/solidcraft-target/wasm32-unknown-unknown/release/solidcraft_trivariate_plugin.wasm" -o "$RUNNER_TEMP/solidcraft-trivariate.wasm"
          wasm-tools component wit "$RUNNER_TEMP/solidcraft-trivariate.wasm"

      - name: Download and verify SolidCraft 0.48.1 CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=solidcraft-0.48.1-linux-x86_64.deb
          url="https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/$archive"
          mkdir -p "$RUNNER_TEMP/solidcraft-0.48.1"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          echo "4f2991b4c0c02e9a58843917ff7b0277c9668d051cb3da272ea363be5e5c0257  $RUNNER_TEMP/$archive" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/solidcraft-0.48.1"
          test -x "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin/solidcraft-cli"
          "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin/solidcraft-cli" --version | grep -F "0.48.1"
          echo "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin" >> "$GITHUB_PATH"

      - name: Stage clean package and cases
        run: |
          mkdir -p "$RUNNER_TEMP/solidcraft-trivariate-package/tests"
          cp plugins/solidcraft-trivariate/plugin.json "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp -R plugins/solidcraft-trivariate/icons "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp "$RUNNER_TEMP/solidcraft-trivariate.wasm" "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp plugins/solidcraft-trivariate/tests/*.json "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp plugins/solidcraft-trivariate/tests/*.sc "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp -R plugins/solidcraft-trivariate/tests/companion "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp -R plugins/solidcraft-trivariate/tests/invalid-descriptor "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"

      - name: Check component ABI and manifest
        run: solidcraft-cli plugin check "$RUNNER_TEMP/solidcraft-trivariate-package" --json

      - name: Run every plugin case on SolidCraft 0.48.1
        run: solidcraft-cli plugin test "$RUNNER_TEMP/solidcraft-trivariate-package" --require-cases --json

      - name: Package installable plugin
        env:
          PACKAGE_DIR: ${{ runner.temp }}/solidcraft-trivariate-package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path(__import__("os").environ["PACKAGE_DIR"])
          target = Path("dist/solidcraft-trivariate-0.4.2.zip")
          target.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(target, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              archive.write(source / "plugin.json", "plugin.json")
              for icon in sorted((source / "icons").glob("*.svg")):
                  archive.write(icon, icon.relative_to(source))
              archive.write(source / "solidcraft-trivariate.wasm", "solidcraft-trivariate.wasm")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-trivariate-plugin
          path: dist/solidcraft-trivariate-0.4.2.zip
          if-no-files-found: error
          retention-days: 14

      - name: Inspect the compact desktop ribbon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/solidcraft-0.48.1-linux-x86_64.deb" xvfb xauth xdotool x11-apps imagemagick mesa-vulkan-drivers
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 scripts/check_compact_ribbon.py dist/solidcraft-trivariate-0.4.2.zip build/compact-ribbon
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ribbon-desktop
          path: |
            build/compact-ribbon/*.png
            build/compact-ribbon/handles.json
            build/compact-ribbon/desktop.log

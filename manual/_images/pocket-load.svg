<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Unit axial stress on a blind pocket</title>
<desc id="desc">Section through the pocket. The top terraces and the lower floor both carry upward unit traction. The bottom face is clamped; the vertical walls are free.</desc>
<defs>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" fill="none" stroke="#596675" stroke-width="1.3"/></pattern>
  <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a44125"/></marker>
</defs>
<rect width="760" height="300" fill="#fff"/>
<g font-family="sans-serif" fill="#19394a">
  <text x="28" y="31" font-size="19" font-weight="bold">Axial tension on the curved pocket</text>
  <text x="28" y="56" font-size="14">Vertical section through the cavity · schematic, dimensions in mm</text>
  <path d="M100 114H230V153H365V114H492V238H100Z" fill="#dcecef" stroke="#264b5b" stroke-width="2"/>
  <path d="M100 114H230M230 153H365M365 114H492" stroke="#a44125" stroke-width="3"/>
  <g stroke="#a44125" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M128 112V83"/><path d="M177 112V83"/><path d="M254 151V122"/><path d="M298 151V122"/><path d="M342 151V122"/><path d="M394 112V83"/><path d="M466 112V83"/>
  </g>
  <rect x="100" y="239" width="392" height="13" fill="url(#hatch)"/>
  <g font-size="14"><text x="39" y="118">z = 20</text><text x="39" y="158">z = 14</text><text x="45" y="242">z = 0</text>
  <text x="178" y="276">Fixed on the entire bottom face</text>
  <text x="525" y="100" font-weight="bold">Applied traction</text><text x="525" y="123">+1 N/mm² on top and floor</text>
  <text x="525" y="158" font-weight="bold">Vertical walls</text><text x="525" y="181">Traction free</text>
  <text x="525" y="215" font-weight="bold">Axial resultant</text><text x="525" y="238">+2,500 N applied</text><text x="525" y="260">−2,500 N reaction</text></g>
</g></svg>

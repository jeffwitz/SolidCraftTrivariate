name: SolidCraft Trivariate plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/solidcraft-trivariate/**"
      - "scripts/*compact*.py"
      - "scripts/*solidcraft*"
      - "scripts/*fieldcraft*"
      - "scripts/fieldcraft_iga_bridge/**"
      - "scripts/*plugin*"
      - "tests/*fieldcraft*"
      - "Cargo.lock"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/solidcraft-trivariate-plugin.yml"
  pull_request:
    paths:
      - "plugins/solidcraft-trivariate/**"
      - "scripts/*compact*.py"
      - "scripts/*solidcraft*"
      - "scripts/*fieldcraft*"
      - "scripts/fieldcraft_iga_bridge/**"
      - "scripts/*plugin*"
      - "tests/*fieldcraft*"
      - "Cargo.lock"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/solidcraft-trivariate-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the guest module
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/solidcraft-target
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path plugins/solidcraft-trivariate/Cargo.toml

      - name: Install wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          version=1.262.0
          archive="wasm-tools-${version}-x86_64-linux.tar.gz"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/${archive}"
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/wasm-tools"
          echo "$RUNNER_TEMP/wasm-tools/wasm-tools-${version}-x86_64-linux" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasm-tools/wasm-tools-${version}-x86_64-linux/wasm-tools" --version

      - name: Wrap and inspect the component
        run: |
          wasm-tools component new "$RUNNER_TEMP/solidcraft-target/wasm32-unknown-unknown/release/solidcraft_trivariate_plugin.wasm" -o "$RUNNER_TEMP/solidcraft-trivariate.wasm"
          wasm-tools component wit "$RUNNER_TEMP/solidcraft-trivariate.wasm"

      - name: Download and verify SolidCraft 0.48.1 CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=solidcraft-0.48.1-linux-x86_64.deb
          url="https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/$archive"
          mkdir -p "$RUNNER_TEMP/solidcraft-0.48.1"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          echo "4f2991b4c0c02e9a58843917ff7b0277c9668d051cb3da272ea363be5e5c0257  $RUNNER_TEMP/$archive" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/solidcraft-0.48.1"
          test -x "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin/solidcraft-cli"
          "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin/solidcraft-cli" --version | grep -F "0.48.1"
          echo "$RUNNER_TEMP/solidcraft-0.48.1/usr/bin" >> "$GITHUB_PATH"

      - name: Stage clean package and cases
        run: |
          mkdir -p "$RUNNER_TEMP/solidcraft-trivariate-package/tests"
          cp plugins/solidcraft-trivariate/plugin.json "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp -R plugins/solidcraft-trivariate/icons "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp "$RUNNER_TEMP/solidcraft-trivariate.wasm" "$RUNNER_TEMP/solidcraft-trivariate-package/"
          cp plugins/solidcraft-trivariate/tests/*.json "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp plugins/solidcraft-trivariate/tests/*.sc "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp -R plugins/solidcraft-trivariate/tests/companion "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp -R plugins/solidcraft-trivariate/tests/companion-unavailable "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"
          cp -R plugins/solidcraft-trivariate/tests/invalid-descriptor "$RUNNER_TEMP/solidcraft-trivariate-package/tests/"

      - name: Validate packaged operation artwork
        run: python3 scripts/check_solidcraft_plugin_icons.py "$RUNNER_TEMP/solidcraft-trivariate-package"

      - name: Check component ABI and manifest
        run: solidcraft-cli plugin check "$RUNNER_TEMP/solidcraft-trivariate-package" --json

      - name: Run every plugin case on SolidCraft 0.48.1
        run: solidcraft-cli plugin test "$RUNNER_TEMP/solidcraft-trivariate-package" --require-cases --json

      - name: Package installable plugin
        run: |
          plugin=$(python3 scripts/package_solidcraft_plugin.py "$RUNNER_TEMP/solidcraft-trivariate-package" dist)
          echo "PLUGIN_ZIP=$plugin" >> "$GITHUB_ENV"
          python3 scripts/solidcraft_compact_desktop.py "$plugin" --profile "$RUNNER_TEMP/package-install" --prepare-only
          sha256sum "$plugin" > "$plugin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-trivariate-plugin
          path: dist/solidcraft-trivariate-*
          if-no-files-found: error
          retention-days: 14

      - name: Inspect the compact desktop ribbon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/solidcraft-0.48.1-linux-x86_64.deb" xvfb xauth xdotool x11-apps imagemagick mesa-vulkan-drivers
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 scripts/check_compact_ribbon.py "$PLUGIN_ZIP" build/compact-ribbon
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ribbon-desktop
          path: |
            build/compact-ribbon/*.png
            build/compact-ribbon/handles.json
            build/compact-ribbon/desktop.log

      - name: Check launcher discovery and file handling
        run: python3 -m unittest discover -s tests -p 'test_solidcraft_compact_desktop.py' -v

      - name: Get the FieldCraft results codec used by stable 0.8.1
        uses: actions/checkout@v4
        with:
          repository: tangency-labs/fieldcraft
          ref: c1bec5b74f666f40b2fa45db89ff2aeccbe61431
          path: upstream/fieldcraft
          persist-credentials: false

      - name: Build native analysis and archive executables
        run: |
          cargo build --locked --release --bin solidcraft-trivariate
          cargo build --manifest-path scripts/fieldcraft_iga_bridge/Cargo.toml --target-dir target --locked --release

      - name: Verify and unpack the released FieldCraft reader
        run: |
          dest="$RUNNER_TEMP/fieldcraft-0.8.1"
          url=https://github.com/tangency-labs/fieldcraft/releases/download/v0.8.1/fieldcraft_0.8.1_amd64.deb
          curl -fsSL "$url" -o "$RUNNER_TEMP/fieldcraft.deb"
          echo "5e82c681e9ffe2a985ba9c6acd9fa694fd86eb8bfe75a08a2021d0f21573da92  $RUNNER_TEMP/fieldcraft.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/fieldcraft.deb" "$dest"
          echo "$dest/usr/bin" >> "$GITHUB_PATH"
          echo "FIELDCRAFT_LICENSES=$dest/usr/share/doc/fieldcraft/THIRD-PARTY-LICENSES.txt" >> "$GITHUB_ENV"

      - name: Solve from the installed ZIP and read back the real FieldCraft contours
        run: |
          bundle=$(python3 scripts/package_fieldcraft_workstation.py "$PLUGIN_ZIP" target/release/solidcraft-trivariate target/release/fieldcraft-iga-archive-bridge upstream/fieldcraft "$FIELDCRAFT_LICENSES" dist)
          mkdir "$RUNNER_TEMP/installed-kit"
          tar -xf "$bundle" -C "$RUNNER_TEMP/installed-kit"
          python3 scripts/check_fieldcraft_desktop.py "$RUNNER_TEMP"/installed-kit/solidcraft-trivariate-* build/fieldcraft-desktop
          xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/check_fieldcraft_window.py \
            build/fieldcraft-desktop/profile/companion/results/*/loaded-bracket.fieldcraft build/fieldcraft-desktop/readback/window.png
          sha256sum "$bundle" > "$bundle.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-fieldcraft-workstation-linux
          path: |
            dist/*.tar.gz*
            build/fieldcraft-desktop/readback/*.png
          if-no-files-found: error

name: Published geometry replay

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'Makefile'
      - 'examples/**'
      - 'tests/references/**'
      - 'tests/regressions/**'
      - 'docs/site/**'
      - 'docs/results/**'
      - 'scripts/build_box_cylinder_tall_patches.py'
      - 'scripts/check_tall_booleans.py'
      - 'scripts/check_*geometry.py'
      - 'scripts/gallery_catalog.py'
      - 'scripts/gallery_curved_patches.py'
      - 'scripts/check_gallery_patch_maps.py'
      - 'scripts/evaluate_polygon_extrusion_quality.py'
      - '.github/workflows/published-geometry.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'Makefile'
      - 'examples/**'
      - 'tests/references/**'
      - 'tests/regressions/**'
      - 'docs/site/**'
      - 'docs/results/**'
      - 'scripts/build_box_cylinder_tall_patches.py'
      - 'scripts/check_tall_booleans.py'
      - 'scripts/check_*geometry.py'
      - 'scripts/gallery_catalog.py'
      - 'scripts/gallery_curved_patches.py'
      - 'scripts/check_gallery_patch_maps.py'
      - 'scripts/evaluate_polygon_extrusion_quality.py'
      - '.github/workflows/published-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make check-published-geometry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: make check-cylinder-iga

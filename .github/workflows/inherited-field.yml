name: Inherited spline fields

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/curved_pocket_field.rs'
      - 'scripts/*curved*pocket*'
      - 'scripts/compare_curved_seam_selection.py'
      - 'docs/results/curved-pocket-fields/**'
      - 'tests/**'
      - 'scripts/*spline*'
      - 'scripts/*inherited*'
      - 'scripts/*support*'
      - 'scripts/*transition*'
      - 'scripts/check_parent*.py'
      - 'scripts/check_pair*.py'
      - 'scripts/check_s3_spline_job.py'
      - 'scripts/check_polygon_join_mechanics.py'
      - 'scripts/*thb*'
      - 'scripts/check_native_crossed_bending.py'
      - 'docs/results/crossed-interface-iga/partial_bending_study.json'
      - 'docs/results/inherited-continuity/**'
      - 'docs/results/continuity-followup/**'
      - 'scripts/check_continuity_followup.py'
      - 'Makefile'
      - '.github/workflows/inherited-field.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuum:
    strategy:
      fail-fast: false
      matrix:
        evaluation: [corpus, refinement]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - if: matrix.evaluation == 'corpus'
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          cargo +1.99.1 clippy --all-targets --locked --offline -- -D warnings
      - if: matrix.evaluation == 'corpus'
        run: |
          cargo test --release --locked --offline --test inherited_continuity --test extracted_space --test pair_parent
          python3 -m unittest discover -s tests -p 'test_*support*.py'
      - if: matrix.evaluation == 'refinement'
        run: cargo test --release --locked --offline --test local_thb_job
      - if: matrix.evaluation == 'corpus'
        run: make check-inherited-corpus
      - if: matrix.evaluation == 'refinement'
        run: make check-local-thb
      - uses: actions/upload-artifact@v4
        with:
          name: inherited-field-${{ matrix.evaluation }}
          path: |
            build/pair-parent-expanded/summary.json
            build/pair-parent-corpus/summary.json
            build/support-census/census.json
            build/support-census/role-index.json
            build/transverse-transitions/summary.json
            build/inherited-mechanics/results.json
            build/polygon-join-mechanics/results.json
            build/inherited-oracle/jets.json
            build/canonical-parent-field/summary.json
            build/parent-spectrum/spectrum.json
            build/thb-mechanics/function-values.json
            build/thb-mechanics/results.json
            build/thb-mechanics/traction-audit.json
            build/curved-supports/chart-jets.json
            build/curved-supports/s3-stress-audit.json
            build/cube-convergence/replay.json
          if-no-files-found: error

  crossed-bending:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --release --locked --offline --test crossed_bending --test conforming_bending
      - run: cargo build --release --locked --offline
      - run: python3 scripts/check_native_crossed_bending.py target/release/solidcraft-trivariate

  continuity-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: make check-continuity-followup
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-followup
          path: |
            build/pocket-vector/
            build/cube-convergence/matched-gaussian-*.json
            build/reentrant-ritz/
          if-no-files-found: error

  curved-pocket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy
      - run: make check-curved-pocket-fields
      - run: python -m unittest discover -s tests -p test_automatic_pocket_load.py
      - uses: actions/upload-artifact@v4
        with:
          name: curved-pocket-fields
          path: |
            build/curved-pocket-fields/
            build/curved-pocket-vector/
          if-no-files-found: error
